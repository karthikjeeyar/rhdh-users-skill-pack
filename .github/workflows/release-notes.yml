name: Release notes

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: uv sync --frozen --extra release-notes

      - name: Regenerate bundled release notes
        run: |
          uv run python skills/rhdh-upgrade-helper/scripts/generate-release-notes.py --all

      - id: diff
        run: |
          if git diff --quiet -- skills/rhdh-upgrade-helper/references/release-notes; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- skills/rhdh-upgrade-helper/references/release-notes
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="bot/release-notes-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add skills/rhdh-upgrade-helper/references/release-notes
          git commit -s -m "docs(rhdh-upgrade-helper): refresh RHDH release notes"
          git push -u origin "$branch"
          {
            echo "Regenerated the bundled RHDH release notes from the official Red Hat documentation."
            echo
            echo "Changed files:"
            echo
            echo '```'
            git show --stat --oneline HEAD | tail -n +2
            echo '```'
            echo
            echo "Generated by .github/workflows/release-notes.yml. Review the wording and merge; do not edit these files by hand."
          } > /tmp/pr-body.md
          gh pr create --base main --head "$branch" \
            --title "docs(rhdh-upgrade-helper): refresh RHDH release notes" \
            --body-file /tmp/pr-body.md
